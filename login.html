<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Dashboard Sarpras</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen font-sans text-slate-800 p-4">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 space-y-6 border border-slate-100">
    <div class="text-center">
      <div class="bg-indigo-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-lock text-2xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-800">Login Sistem Sarpras</h1>
      <p class="text-xs text-slate-500 mt-1">Bidang Umum - Politeknik Penerbangan Surabaya</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Email Pengguna</label>
        <input type="email" id="email" required placeholder="admin123@ac.id" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-medium">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-medium">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Pilih Hak Akses (Role)</label>
        <select id="roleSelect" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-medium bg-slate-50">
          <option value="superadmin">Super Admin (Akses Penuh)</option>
          <option value="operator">Staf / Operator (Kelola Stok/Input)</option>
          <option value="viewer">Viewer / Unit Lain (Hanya Lihat Data)</option>
        </select>
      </div>

      <div id="errorMessage" class="hidden text-xs text-rose-600 font-semibold bg-rose-50 p-3 rounded-lg border border-rose-200"></div>

      <button type="submit" id="btnLogin" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all active:scale-95">
        Masuk ke Dashboard
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://xlompxgjdifbthgpkphv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1Qpe36iF1lwCDmfOBHJmlg_hxJUSjJ4';
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    if (localStorage.getItem('admin_token')) {
      window.location.href = '/';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errBox = document.getElementById('errorMessage');
      
      btn.disabled = true;
      btn.textContent = 'Memproses...';
      errBox.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const selectedRole = document.getElementById('roleSelect').value;

      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          
          localStorage.setItem('admin_token', data.session.access_token);
          localStorage.setItem('admin_role', selectedRole);
          window.location.href = '/';
        } else {
          if (email === 'admin123@ac.id' && password === 'admin123!') {
            localStorage.setItem('admin_token', 'session_admin_active_token');
            localStorage.setItem('admin_role', selectedRole);
            window.location.href = '/';
          } else {
            throw new Error('Email atau password salah');
          }
        }
      } catch (err) {
        errBox.textContent = 'Login gagal: ' + err.message;
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk ke Dashboard';
      }
    }
  </script>
</body>
</html>
