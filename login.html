<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MONSARPRAS Poltekbang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Dekorasi Latar -->
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-8 relative z-10">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600/20 border border-blue-500/30 text-blue-400 mb-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">MONSARPRAS</h1>
      <p class="text-sm text-slate-400 mt-1">Sistem Monitoring Sarana & Prasarana — Bidang Umum</p>
    </div>

    <!-- Alert Logout / Info -->
    <div id="info-box" class="hidden mb-5 p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs leading-relaxed"></div>

    <!-- Alert Error -->
    <div id="error-box" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs leading-relaxed"></div>

    <!-- Form Login -->
    <form id="login-form" class="space-y-5">
      <div>
        <label for="email" class="block text-xs font-medium text-slate-300 mb-1.5">Email Terdaftar</label>
        <input
          type="email"
          id="email"
          required
          placeholder="nama@poltekbangsby.ac.id"
          class="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-slate-700 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Kata Sandi</label>
        <div class="relative">
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-2.5 pr-11 rounded-xl bg-slate-950/80 border border-slate-700 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
          />
          <button
            type="button"
            onclick="togglePassword()"
            class="absolute inset-y-0 right-0 px-3.5 text-slate-400 hover:text-slate-200 text-xs"
            title="Lihat/Sembunyikan Sandi"
          >
            👁️
          </button>
        </div>
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2 cursor-pointer"
      >
        <span>Masuk ke Sistem</span>
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-slate-800/80 text-center space-y-2">
      <p class="text-[11px] text-slate-500">
        Peran Akses: <span class="text-slate-400">Super Admin</span> • <span class="text-slate-400">Teknisi</span> • <span class="text-slate-400">Pimpinan</span>
      </p>
      <a href="/executive?kiosk=1" class="inline-block text-[11px] font-semibold text-amber-400 hover:text-amber-300 transition">
        📺 Buka Mode Monitor TV (Kiosk)
      </a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xlompxgjdifbthgpkphv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1Qpe36iF1lwCDmfOBHJmlg_hxJUSjJ4';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Ganti tujuan default setelah login di sini (misal: '/bidang-umum' atau '/executive.html')
    function getDashboardUrl() {
      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get('redirect');
      if (nextUrl) return nextUrl;
      return window.location.protocol === 'file:' ? 'bidang-umum.html' : '/bidang-umum';
    }

    (async () => {
      const params = new URLSearchParams(window.location.search);

      // Jika datang dari klik tombol Logout, paksa hapus sesi lokal & tampilkan pesan
      if (params.get('logout') === '1') {
        await sb.auth.signOut();
        localStorage.clear();
        sessionStorage.clear();
        const infoBox = document.getElementById('info-box');
        infoBox.textContent = 'Anda telah berhasil keluar dari sistem. Silakan login kembali.';
        infoBox.classList.remove('hidden');
        // Bersihkan URL agar tidak berulang
        window.history.replaceState({}, document.title, window.location.pathname);
        return;
      }

      // Cek apakah user sudah login dengan sesi valid
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const { data: profile } = await sb
          .from('user_profiles')
          .select('role')
          .eq('id', session.user.id)
          .single();

        if (profile) {
          window.location.replace(getDashboardUrl());
        }
      }
    })();

    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      const errBox = document.getElementById('error-box');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span>Memverifikasi akun...</span>';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errBox.textContent = 'Login gagal: ' + (error.message === 'Invalid login credentials' ? 'Email atau kata sandi salah.' : error.message);
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk ke Sistem</span>';
        return;
      }

      const { data: profile, error: profErr } = await sb
        .from('user_profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

      if (profErr || !profile) {
        await sb.auth.signOut();
        errBox.textContent = 'Akun berhasil terautentikasi, namun belum didaftarkan perannya di tabel user_profiles.';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk ke Sistem</span>';
        return;
      }

      window.location.replace(getDashboardUrl());
    });
  </script>
</body>
</html>
